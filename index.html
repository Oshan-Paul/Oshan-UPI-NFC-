<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pay Oshan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            margin-bottom: 8px;
        }

        .upi {
            color: #666;
            margin-bottom: 30px;
        }

        .pay-button {
            display: block;
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Pay Oshan</h1>

    <div class="upi">
        UPI: oshanpaul@slc
    </div>

    <a
        class="pay-button"
        href="upi://pay?pa=oshanpaul%40slc&pn=Oshan&cu=INR"
    >
        Pay with UPI
    </a>

    <div class="note">
        Select your preferred UPI app and enter the amount.
    </div>

</div>

</body>
</html>
